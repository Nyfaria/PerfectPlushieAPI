plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.loom.loader)
    id("com.nyfaria.moddingtools.dependencies")
    id("com.nyfaria.moddingtools.publishing")
    id 'multiloader-fabric'
    id 'dev._100media.gradleutils' version '1.+'
    id 'maven-publish'
}

dependencies {
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    modDeps.requiredMod(nyfs.geckolib.fabric, "geckolib", null)
    modDeps.requiredMod(nyfs.config.api.fabric, "forgeconfigapiport", null)
}

afterEvaluate {
    def seen = [] as Set
    configurations.sourcesElements.outgoing.artifacts.removeIf { !seen.add(it.file) }
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = "${mod_id}-fabric"
            version = "${project.version}+${minecraft_version}"

            pom {
                name = "${mod_name} (Fabric)"
                description = project.description ?: 'API for Adding more Perfect Plushies'
                url = 'https://github.com/Nyfaria/PerfectPlushieAPI'

                licenses {
                    license {
                        name = 'All Rights Reserved'
                        url = 'https://github.com/Nyfaria/PerfectPlushieAPI'
                    }
                }

                developers {
                    developer {
                        id = 'nyfaria'
                        name = 'Nyfaria'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/Nyfaria/PerfectPlushieAPI.git'
                    developerConnection = 'scm:git:ssh://github.com/Nyfaria/PerfectPlushieAPI.git'
                    url = 'https://github.com/Nyfaria/PerfectPlushieAPI'
                }
            }
        }
    }

    repositories {
        maven(hundredMedia.getPublishing100MediaMaven())
    }
}
